[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epilepsy-eeg-research"
version = "0.1.0"
description = "Reproducible two-module mouse epilepsy EEG detection and PG36 morphology research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
deep = ["torch>=2.3,<3"]
parquet = ["pyarrow>=16,<24"]
viz = ["matplotlib>=3.8,<4", "seaborn>=0.13,<1"]
edf = ["mne>=1.8,<2", "edfio>=0.4,<1"]
pg36 = ["braindecode>=0.8,<1"]
dev = ["pytest>=8,<9"]
all = [
  "torch>=2.3,<3",
  "pyarrow>=16,<24",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "mne>=1.8,<2",
  "edfio>=0.4,<1",
  "braindecode>=0.8,<1",
]

[project.scripts]
epilepsy-eeg = "epilepsy_eeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
